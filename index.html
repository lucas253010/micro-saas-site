<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agende sua consulta</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><main class="wrap">
<section class="hero"><h1>Um espaço seguro para você se ouvir com calma</h1>
<p class="mut">Terapia individual presencial e online, com acolhimento e sem pressa. Escolha um horário e eu confirmo com você.</p>
<p class="mut" id="quem"></p></section>
<section class="card"><h2>Agende sua primeira conversa</h2>
<p class="mut">Sessão de acolhimento de 50 minutos.</p>
<div class="chips" id="dias"></div><div class="slots" id="horas"></div>
<div class="field"><input id="nome" placeholder="Seu nome" autocomplete="name">
<input id="zap" placeholder="WhatsApp com DDD" inputmode="tel" autocomplete="tel">
<select id="modo" aria-label="Modalidade"><option>Presencial</option><option>Online</option></select>
<button class="btn" id="ok" disabled>Agendar horário</button></div>
<div class="msg" id="msg" hidden></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const C=CFG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY),$=i=>document.getElementById(i);
let dia=null,hora=null,ocupados=[];
$('quem').textContent=C.NOME+', '+C.SUBTITULO;
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dias=[];for(let i=0;dias.length<C.DIAS_A_FRENTE&&i<40;i++){const d=new Date();d.setDate(d.getDate()+i);if(d.getDay()>0&&d.getDay()<6)dias.push(d)}
async function escolherDia(d){dia=ymd(d);hora=null;const{data}=await sb.rpc('horarios_ocupados',{dia});ocupados=(data||[]).map(x=>x.hora.slice(0,5));desenha()}
function desenha(){
  $('dias').innerHTML='';dias.forEach(d=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',ymd(d)===dia);
    b.textContent=d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});b.onclick=()=>escolherDia(d);$('dias').appendChild(b)});
  $('horas').innerHTML='';if(!dia)return;const agora=new Date(),hoje=ymd(agora)===dia;
  C.HORAS.forEach(h=>{const b=document.createElement('button');b.className='chip';b.textContent=h;
    const passou=hoje&&(+h.slice(0,2)*60+ +h.slice(3))<=agora.getHours()*60+agora.getMinutes();
    b.disabled=ocupados.includes(h)||passou;b.setAttribute('aria-pressed',hora===h);b.onclick=()=>{hora=h;desenha()};$('horas').appendChild(b)});
  valida()}
function valida(){$('ok').disabled=!(dia&&hora&&$('nome').value.trim()&&$('zap').value.replace(/\D/g,'').length>=10)}
$('nome').oninput=$('zap').oninput=valida;
$('ok').onclick=async()=>{
  const nome=$('nome').value.trim(),modo=$('modo').value;let zap=$('zap').value.replace(/\D/g,'');if(zap.length<=11)zap='55'+zap;
  const link=modo==='Online'?'https://meet.jit.si/consulta-'+crypto.randomUUID().slice(0,12):null;
  $('ok').disabled=true;
  const{error}=await sb.from('consultas').insert({data:dia,hora,nome,whatsapp:zap,modalidade:modo,link_sessao:link,valor:C.VALOR});
  $('msg').hidden=false;
  if(error){
    $('msg').textContent=error.code==='23505'?'Esse horário acabou de ser ocupado. Escolha outro.':'Não foi possível agendar: '+error.message;
    await escolherDia(new Date(dia+'T12:00'));
    return;
  }
  $('msg').textContent='Pronto, '+nome+'. Seu horário foi reservado e vou confirmar pelo WhatsApp.';
  $('nome').value='';$('zap').value='';
  await escolherDia(new Date(dia+'T12:00'));
};
desenha();escolherDia(dias[0]);
</script></body></html>
